<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://d4niel-dev.github.io/Dizel/assets/site/app-desktop.png">
<meta property="og:image:width" content="1475">
<meta property="og:image:height" content="975">
<meta property="og:image:alt" content="The Dizel desktop app with a chat sidebar, a session chip and a composer.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://d4niel-dev.github.io/Dizel/assets/site/app-desktop.png">
<meta name="theme-color" content="#E8EAED">
<link rel="icon" type="image/x-icon" href="{{base}}assets/app/Dizel.ico">
<link rel="icon" type="image/png" href="{{base}}assets/app/Dizel.png">
<link rel="preload" href="{{base}}assets/fonts/Archivo-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{base}}assets/fonts/GeistMono-400.woff2" as="font" type="font/woff2" crossorigin>
{{theme_init}}
<link rel="stylesheet" href="{{base}}styles/site.css">
</head>
<body class="site">
<!-- direction contract
     THESIS   A model under construction is measured, not narrated: every claim sits on the same
              bench panel as its status, and the router is the page's instrument, not an illustration.
              Refuses the editorial report and the neon-on-black category hero.
     OWN-WORLD Cool porcelain ground, one always-dark product slab, the model's periwinkle signal, Archivo and
              Geist Mono, 1px measurement rules with etch ticks, square 3px controls, tabular data.
     STORY    The visitor learns which model actually runs, pokes the router, sees the app, and
              installs v1.5; the preview's gaps stay visible the whole way down.
     VIEWPORT Slim sticky nav; a dark bench slab opens with a mono console readout, the headline
              "A small model that stays yours." set left, and a live router panel right. Evidence
              runs as a six-cell readout along the slab's bottom edge.
     FORM     Measurement bench: a dark instrument over a ruled porcelain sheet, with the routing
              mechanism as the only interaction on the first screen.
     FINISH   Reviewed in-thread against this contract at 390, 768, 1024, 1440 and 3200px; no design
              system document was requested for this scoped refresh of the existing site.
-->
<a class="s-site-skip" href="#main">Skip to content</a>
{{nav}}
<main id="main" tabindex="-1">{{body}}</main>
{{footer}}
<script src="{{base}}js/site.js" defer></script>
</body>
</html>
