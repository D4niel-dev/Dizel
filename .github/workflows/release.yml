name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 2.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify update engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q api dizel_core inference/tui scripts tests
      - name: Run test suite
        run: python -m pytest tests -q

  gui:
    name: Build GUI installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: inference/gui/package-lock.json
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No release version supplied." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: python scripts/set_version.py "${{ steps.version.outputs.value }}"
      - name: Install dependencies
        working-directory: inference/gui
        run: npm ci
      - name: Build renderer
        working-directory: inference/gui
        run: npm run build
      - name: Build Windows installer
        working-directory: inference/gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Pack npm tarball
        working-directory: inference/gui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../release-artifacts | Out-Null
          npm pack --pack-destination ../../release-artifacts
      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item inference/gui/release/*.exe release-artifacts/
          if (-not (Test-Path inference/gui/release/latest.yml)) {
            throw "latest.yml was not generated; the desktop updater would not work."
          }
          Copy-Item inference/gui/release/latest.yml release-artifacts/
          if (Test-Path inference/gui/release/*.blockmap) {
            Copy-Item inference/gui/release/*.blockmap release-artifacts/
          }
      - uses: actions/upload-artifact@v4
        with:
          name: gui-release
          path: release-artifacts/*
          if-no-files-found: error

  tui:
    name: Build TUI archive
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No release version supplied." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        run: python scripts/set_version.py "${{ steps.version.outputs.value }}"
      - name: Build portable TUI zip
        run: python scripts/package_tui.py --version "${{ steps.version.outputs.value }}" --output release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: tui-release
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - gui
      - tui
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gui-release
          path: artifacts/gui
      - uses: actions/download-artifact@v4
        with:
          name: tui-release
          path: artifacts/tui
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No release version supplied." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Write update manifest
        run: |
          GUI=$(find artifacts/gui -maxdepth 1 -name 'Dizel-Setup-*.exe' | head -n 1)
          TUI=$(find artifacts/tui -maxdepth 1 -name 'Dizel-TUI-*.zip' | head -n 1)
          if [ -z "$GUI" ] || [ -z "$TUI" ]; then
            echo "Missing installer or TUI archive." >&2
            exit 1
          fi
          python scripts/build_update_manifest.py \
            --version "${{ steps.version.outputs.value }}" \
            --tag "v${{ steps.version.outputs.value }}" \
            --gui "$GUI" \
            --tui "$TUI" \
            --output artifacts/gui/dizel-update.json
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Dizel v${{ steps.version.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            artifacts/gui/*
            artifacts/tui/*

  npm:
    name: Publish npm launcher
    needs: publish
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
