name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - run: python -m compileall -q api dizel_core inference/tui scripts tests
      - run: python -m pytest tests -q
      - name: Package TUI smoke test
        run: python scripts/package_tui.py --output /tmp/dizel-tui

  gui:
    name: GUI typecheck and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: inference/gui/package-lock.json
      - name: Install dependencies
        working-directory: inference/gui
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: inference/gui
        run: npm run build
