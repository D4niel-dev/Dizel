name: Publish npm launcher

on:
  workflow_call:
    inputs:
      version:
        description: "Launcher version to publish, without the v prefix"
        required: false
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Launcher version to publish, without the v prefix"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dizel to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "No launcher version supplied." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp launcher version
        run: |
          node -e 'const fs=require("fs");const p=require("./package.json");p.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");' "${{ steps.version.outputs.value }}"

      - name: Smoke test the launcher
        run: |
          node bin/dizel.js --help
          node bin/dizel.js version
          node bin/dizel.js doctor --json > doctor.json
          node -e 'const report=require("./doctor.json"); if (!report.node || !report.launcher) process.exit(1)'

      - name: Require npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Add the NPM_TOKEN repository secret before publishing." >&2
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG=latest
          case "${{ steps.version.outputs.value }}" in
            *-*) TAG=next ;;
          esac
          npm publish --access public --tag "$TAG"
